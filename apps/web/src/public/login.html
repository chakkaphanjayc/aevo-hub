<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Welcome Back — Aevo Hub</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;500;600&family=IBM+Plex+Sans+Thai:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/shared.css">
  <style>
    body {
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 40px 16px;
    }
    .auth-card {
      background: var(--surface);
      border: 1px solid var(--line);
      border-radius: var(--radius-lg);
      box-shadow: var(--shadow-popover);
      width: 100%;
      max-width: 440px;
      padding: 38px 34px;
      display: flex;
      flex-direction: column;
      gap: 20px;
      animation: subtle-fade 0.25s ease;
    }
    .auth-card-head {
      text-align: center;
    }
    .auth-title {
      font-family: var(--font-serif);
      font-size: 1.85rem;
      font-weight: 500;
      letter-spacing: -0.015em;
      color: var(--text-main);
      margin-bottom: 6px;
    }
    .auth-subtitle {
      font-size: 0.85rem;
      color: var(--text-muted);
      line-height: 1.4;
    }
    .auth-form {
      display: flex;
      flex-direction: column;
      gap: 14px;
    }
    .auth-divider {
      display: flex;
      align-items: center;
      gap: 12px;
      color: var(--text-light);
      font-size: 0.75rem;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      margin: 4px 0;
    }
    .auth-divider::before, .auth-divider::after {
      content: "";
      flex: 1;
      height: 1px;
      background: var(--line);
    }
    .auth-foot {
      text-align: center;
      font-size: 0.82rem;
      color: var(--text-muted);
    }
    .auth-foot a {
      color: var(--brand-dark);
      font-weight: 600;
      text-decoration: none;
      cursor: pointer;
    }
    .auth-foot a:hover {
      text-decoration: underline;
    }
  </style>
</head>
<body>
  <div class="auth-card">
    <div class="auth-card-head">
      <a href="/" class="brand-group" style="display:inline-flex; margin-bottom:14px;">
        <div class="brand-mark" style="width:36px; height:36px;">A</div>
      </a>
      <div class="locale-switcher" data-locale-switcher id="login-locale-switcher"></div>
      <h2 class="auth-title" data-i18n="auth.login.title">Welcome Back</h2>
      <p class="auth-subtitle" data-i18n="auth.login.subtitle">ลงชื่อเข้าใช้เพื่อจัดการร้านค้าและแอปของคุณ</p>
    </div>

    <form id="form-login" class="auth-form">
      <div class="input-field-group">
        <label for="login-email"><span data-i18n="auth.login.email">อีเมล</span> *</label>
        <input type="email" id="login-email" required placeholder="owner@business.com" autocomplete="email" />
      </div>

      <div class="input-field-group">
        <div style="display:flex; justify-content:space-between; align-items:center;">
          <label for="login-password"><span data-i18n="auth.login.password">รหัสผ่าน</span> *</label>
          <a href="/forgot-password" data-i18n="auth.login.forgot" style="font-size:0.75rem; color:var(--brand-dark); text-decoration:none;">ลืมรหัสผ่าน?</a>
        </div>
        <input type="password" id="login-password" required placeholder="••••••••" autocomplete="current-password" />
      </div>

      <button type="submit" id="btn-submit" class="pill-btn pill-btn-primary" style="width:100%; padding:10px; margin-top:6px;">
        <span data-i18n="auth.login.submit">เข้าสู่ระบบ (Sign In) →</span>
      </button>
    </form>

    <div class="auth-foot">
      <span data-i18n="auth.login.noAccount">ยังไม่มีบัญชี?</span> <a href="/register" data-i18n="auth.login.register">สมัครสมาชิกฟรี (Register) →</a>
    </div>

    <div style="text-align:center;">
      <a href="/" data-i18n="auth.login.back" style="font-size:0.78rem; color:var(--text-light); text-decoration:none;">← กลับสู่หน้าหลัก Aevo Hub</a>
    </div>
  </div>

  <!-- Toast Notification Tray -->
  <div class="toast-tray" id="toast-tray"></div>

  <script type="module">
    import { apiFetch, getDefaultAuthenticatedPath, redirectIfAuthenticated } from "/auth.js";
    import { createI18n } from "/i18n.js";

    const i18n = createI18n({ apiFetch });
    void i18n.init();

    function showToast(msg, isError = false) {
      const container = document.getElementById("toast-tray");
      const toast = document.createElement("div");
      toast.className = "toast-bubble" + (isError ? " error" : "");
      toast.textContent = msg;
      container.appendChild(toast);
      setTimeout(() => {
        toast.style.opacity = "0";
        toast.style.transition = "opacity 0.25s";
        setTimeout(() => toast.remove(), 250);
      }, 4000);
    }

    const loginParams = new URLSearchParams(window.location.search);
    const handoffApplication = (loginParams.get("app") || "").toUpperCase();
    const handoffReturnTo = loginParams.get("returnTo") || "/";

    function isSafeReturnPath(value) {
      return typeof value === "string" && value.startsWith("/") && !value.startsWith("//") && !value.includes("\\");
    }

    function applicationUrl(application) {
      const configured = window.__AEVO_APP_URLS__?.[application.toLowerCase()];
      if (typeof configured !== "string" || !/^https?:\/\//u.test(configured)) return null;
      return configured.replace(/\/+$/u, "");
    }

    async function completeAppHandoff() {
      if (!(["PLAY", "POS", "GO"].includes(handoffApplication)) || !isSafeReturnPath(handoffReturnTo)) return false;
      const targetOrigin = applicationUrl(handoffApplication);
      if (!targetOrigin) throw new Error("The requested application is not configured for this environment");
      const result = await apiFetch("/api/auth/handoff", {
        method: "POST",
        body: JSON.stringify({
          application: handoffApplication,
          returnTo: handoffReturnTo,
          ...(loginParams.get("state") ? { state: loginParams.get("state") } : {}),
          ...(loginParams.get("code_challenge") ? { codeChallenge: loginParams.get("code_challenge") } : {})
        })
      });
      const callback = new URL(targetOrigin);
      callback.pathname = `${callback.pathname.replace(/\/+$/u, "")}/auth/callback`;
      callback.searchParams.set("code", result.code);
      if (result.state) callback.searchParams.set("state", result.state);
      window.location.assign(callback.toString());
      return true;
    }

    async function redirectAfterExistingSession() {
      if (["PLAY", "POS", "GO"].includes(handoffApplication)) {
        try {
          await apiFetch("/api/auth/me");
          await completeAppHandoff();
          return;
        } catch (error) {
          if (error?.status === 401) return;
          showToast(error instanceof Error ? error.message : "Unable to continue to the application", true);
          return;
        }
      }
      await redirectIfAuthenticated(loginParams.get("next"));
    }

    void redirectAfterExistingSession();

    const loginForm = document.getElementById("form-login");
    loginForm.onsubmit = async (e) => {
      e.preventDefault();
      const email = document.getElementById("login-email").value.trim();
      const password = document.getElementById("login-password").value;
      const submitBtn = document.getElementById("btn-submit");

      submitBtn.disabled = true;
      submitBtn.textContent = i18n.t("common.loading");
      try {
        const data = await apiFetch("/api/auth/login", {
          method: "POST",
          body: JSON.stringify({ email, password })
        });
        showToast("Signed in successfully");

        if (await completeAppHandoff()) return;

        const requestedNext = new URLSearchParams(window.location.search).get("next");
        const safeNext = requestedNext && requestedNext.startsWith("/") && !requestedNext.startsWith("//") && !requestedNext.includes("\\")
          ? requestedNext
          : null;
        if (safeNext) {
          window.location.assign(safeNext);
          return;
        }

        const bootstrap = await apiFetch("/api/v1/hub/bootstrap");
        window.location.assign(getDefaultAuthenticatedPath(bootstrap));
      } catch (err) {
        showToast(err instanceof Error ? err.message : "Login failed", true);
        submitBtn.disabled = false;
        submitBtn.innerHTML = `<span>${i18n.t("auth.login.submit")}</span>`;
      }
    };
  </script>
</body>
</html>
