<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Choose a new password — Aevo Hub</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Thai:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/shared.css" />
  <style>
    body { display:grid; min-height:100vh; place-items:center; padding:20px; }
    .card { width:min(440px,100%); padding:34px; background:var(--surface); border:1px solid var(--line); border-radius:var(--radius-lg); box-shadow:var(--shadow-popover); }
    h1 { margin:0 0 8px; font:500 2rem var(--font-serif); }
    p { margin:0 0 24px; color:var(--text-muted); font-size:.82rem; line-height:1.6; }
    form { display:grid; gap:14px; }
    label { display:grid; gap:7px; color:var(--text-muted); font-size:.72rem; font-weight:700; }
    input { width:100%; min-height:42px; padding:9px 11px; border:1px solid var(--line); border-radius:8px; font:inherit; }
    button { min-height:42px; color:#fff; background:var(--brand-dark); border:0; border-radius:8px; font:600 .78rem var(--font-sans); cursor:pointer; }
    button:disabled { opacity:.6; cursor:wait; }
    .message { min-height:20px; margin-top:15px; color:var(--brand-dark); font-size:.75rem; }
    .message.error { color:#9a3d35; }
    a { display:inline-block; margin-top:18px; color:var(--brand-dark); font-size:.75rem; font-weight:700; text-decoration:none; }
  </style>
</head>
<body>
  <main class="card">
    <div class="locale-switcher" data-locale-switcher id="reset-locale-switcher"></div>
    <div class="eyebrow" data-i18n="auth.reset.eyebrow">Aevo Hub / Account security</div>
    <h1 data-i18n="auth.reset.title">Choose a new password</h1>
    <p data-i18n="auth.reset.description">This one-time recovery link expires automatically. Your existing Aevo Hub sessions will be signed out after the change.</p>
    <form id="reset-form">
      <label for="password"><span data-i18n="auth.reset.password">New password</span><input id="password" type="password" minlength="8" autocomplete="new-password" required /></label>
      <label for="confirm"><span data-i18n="auth.reset.confirm">Confirm password</span><input id="confirm" type="password" minlength="8" autocomplete="new-password" required /></label>
      <button type="submit" id="submit" data-i18n="auth.reset.submit">Update password</button>
    </form>
    <div class="message" id="message" aria-live="polite"></div>
    <a href="/login" data-i18n="auth.reset.back">← Back to sign in</a>
  </main>
  <script type="module">
    import { apiFetch } from "/auth.js";
    import { createI18n } from "/i18n.js";
    const i18n = createI18n({ apiFetch });
    void i18n.init();
    const recoveryToken = new URLSearchParams(window.location.hash.slice(1)).get("access_token");
    if (window.location.hash) window.history.replaceState(null, "", "/reset-password");
    const form = document.getElementById("reset-form");
    const button = document.getElementById("submit");
    const message = document.getElementById("message");
    if (!recoveryToken) {
      button.disabled = true;
      message.className = "message error";
      message.textContent = "This reset link is missing or has already been used.";
    }
    form.addEventListener("submit", async (event) => {
      event.preventDefault();
      const password = document.getElementById("password").value;
      if (password !== document.getElementById("confirm").value) {
        message.className = "message error";
        message.textContent = "Passwords do not match.";
        return;
      }
      button.disabled = true;
      message.className = "message";
      try {
        await apiFetch("/api/auth/password/update", {
          method: "POST",
          body: JSON.stringify({ accessToken: recoveryToken, password })
        }, false);
        message.textContent = "Password updated. You can sign in with the new password.";
        window.setTimeout(() => window.location.assign("/login"), 900);
      } catch (error) {
        message.className = "message error";
        message.textContent = error instanceof Error ? error.message : "Unable to update the password.";
        button.disabled = false;
      }
    });
  </script>
</body>
</html>
